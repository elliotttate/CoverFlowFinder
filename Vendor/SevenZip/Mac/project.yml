  # ---------------------------------------------------------------------------
  # SevenZipKit: Objective-C++ bridge framework. Swift sees only Core/include.
  # ---------------------------------------------------------------------------
  SevenZipKit:
    type: framework
    platform: macOS
    sources:
      - path: Core
        headerVisibility: project
        excludes:
          - "Platform/**"
          - "include/**"
          - "Info.plist"
      - path: Core/include
        headerVisibility: public
      - path: Resources/Lang
        type: folder
        buildPhase: resources
    dependencies:
      - target: SevenZipCore
        link: true
      - sdk: Foundation.framework
      - sdk: CoreServices.framework
    settings:
      base:
        PRODUCT_NAME: SevenZipKit
        PRODUCT_BUNDLE_IDENTIFIER: com.yrambler2001.7zip.SevenZipKit
        INFOPLIST_FILE: Core/Info.plist
        DEFINES_MODULE: YES
        MODULEMAP_FILE: ""
        CLANG_ENABLE_OBJC_ARC: YES
        CLANG_ENABLE_MODULES: YES
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "NDEBUG=1", "_REENTRANT=1", "_FILE_OFFSET_BITS=64", "_LARGEFILE_SOURCE=1"]
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        CLANG_WARN_DOCUMENTATION_COMMENTS: NO
        WARNING_CFLAGS: ["-Wall", "-Wextra"]
        # The engine registers formats/codecs from static constructors in
        # *Register.cpp; nothing references those objects, so force-load the
        # whole archive (02-engine-api.md 4.5).
        OTHER_LDFLAGS: ["$(inherited)", "-lc++", "-Wl,-force_load,$(BUILT_PRODUCTS_DIR)/libSevenZipCore.a"]
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks", "@loader_path/Frameworks"]
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        SKIP_INSTALL: YES
      # packaging scope: the bridge used to be pinned at -O0 in *every* configuration, so a Release
      # build shipped an unoptimized ObjC++ layer while Swift got -O and the engine -O2. Debug keeps
      # -O0 for debuggability; Release matches SevenZipCore at -O2.
      configs:
        Debug:
          GCC_OPTIMIZATION_LEVEL: 0
        Release:
          GCC_OPTIMIZATION_LEVEL: 2

